<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Arcade Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 3rem; font-weight: 900; letter-spacing: 2px; color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.4); margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 1.2rem; }
    .arcade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; }
    .game-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease-in-out; position: relative; overflow: hidden; }
    .game-card:hover { transform: translateY(-6px); border-color: #fbbf24; box-shadow: 0 12px 24px rgba(251, 191, 36, 0.15); }
    .card-icon { font-size: 3.5rem; margin-bottom: 15px; }
    .card-title { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
    .card-desc { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
    .tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tag { background: #334155; color: #38bdf8; font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 12px; text-transform: uppercase; }
    .play-btn { display: inline-block; text-align: center; background: #fbbf24; color: #0f172a; font-weight: 800; font-size: 1.1rem; text-decoration: none; padding: 12px 20px; border-radius: 8px; transition: background 0.2s; }
    .play-btn:hover { background: #f59e0b; }
    .game-card.coming-soon { border: 2px dashed #334155; background: transparent; opacity: 0.6; }
    .game-card.coming-soon:hover { transform: none; box-shadow: none; border-color: #334155; }
    .coming-soon .play-btn { background: #334155; color: #64748b; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>🕹️ CLASSROOM ARCADE</h1>
    <p>Select a game to launch</p>
  </header>
  <main class="arcade-grid">
    <div class="game-card">
      <div>
        <div class="card-icon">📺</div>
        <h2 class="card-title">Vocabulary Jeopardy</h2>
        <div class="tags">
          <span class="tag">6 Teams</span>
          <span class="tag">Custom Lists</span>
          <span class="tag">Timer</span>
        </div>
        <p class="card-desc">Interactive Jeopardy board with automated timer, scorekeeper, and custom word list uploader.</p>
      </div>
      <a href="jeopardy.html" class="play-btn">PLAY GAME 🚀</a>
    </div>
    <div class="game-card coming-soon">
      <div>
        <div class="card-icon">🎲</div>
        <h2 class="card-title">Game #2</h2>
        <div class="tags"><span class="tag">Coming Soon</span></div>
        <p class="card-desc">Slot ready for your next custom classroom game.</p>
      </div>
      <a href="#" class="play-btn">LOCKED 🔒</a>
    </div>
  </main>
</body>
</html>
