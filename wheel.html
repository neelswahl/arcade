<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wheel of Fortune</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background: linear-gradient(135deg, #7e22ce 0%, #3b82f6 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    /* HEADER BAR */
    header {
      width: 100%;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffdf00;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .setup-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.2s;
    }
    .setup-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* CATEGORY BADGE */
    .category-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .category-badge {
      background: rgba(255, 223, 0, 0.25);
      border: 2px solid #ffdf00;
      color: #ffdf00;
      padding: 6px 20px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 223, 0, 0.3);
    }

    /* MULTI-ROW PUZZLE BOARD */
    .board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
    }
    .puzzle-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .tile-card {
      width: clamp(38px, 4.2vw, 55px);
      height: clamp(50px, 5.5vw, 70px);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      font-weight: 900;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .tile-card.letter-hidden {
      background: #18182c;
      border: 2px solid #2a3282;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .tile-card.letter-revealed {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #ffdf00;
      box-shadow: 0 0 12px rgba(255, 223, 0, 0.5);
      animation: flipTile 0.4s ease-out;
    }
    .tile-card.space {
      visibility: hidden;
      width: clamp(20px, 2vw, 30px);
    }

    @keyframes flipTile { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0deg); } }

    /* DASHBOARD PANEL (CONTROLS - WHEEL - SCOREBOARD) */
    .dashboard-panel {
      display: flex;
      width: 100%;
      height: 240px;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      align-items: center;
      justify-content: space-between;
    }

    /* LEFT CONTROLS */
    .left-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .status-text {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffdf00;
      text-shadow: 1px 2px 0 rgba(0,0,0,0.5);
      text-align: center;
      min-height: 28px;
    }
    .turn-badge {
      width: 80%;
      max-width: 220px;
      padding: 10px;
      background: #ef4444;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .ctrl-btn {
      width: 80%;
      max-width: 220px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s;
    }
    .ctrl-btn:active { transform: scale(0.96); }
    .btn-vowel { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
    .btn-solve { background: #22c55e; color: #fff; box-shadow: 0 4px 0 #15803d; }

    /* CENTER WHEEL */
    .wheel-wrapper {
      position: relative;
      width: 210px;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #wheelCanvas {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.6), 0 0 0 6px rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
    }
    .pointer {
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-right: 22px solid #ef4444;
      filter: drop-shadow(-2px 2px 3px rgba(0,0,0,0.5));
      z-index: 10;
    }

    /* RIGHT SCOREBOARD */
    .right-scoreboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .team-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid transparent;
      transition: border 0.2s;
    }
    .team-box.team-1 { background: #dc2626; }
    .team-box.team-2 { background: #1d4ed8; }
    .team-box.active { border-color: #ffdf00; box-shadow: inset 0 0 15px rgba(255,223,0,0.5); }
    .team-name { font-size: 0.85rem; font-weight: 900; opacity: 0.9; letter-spacing: 1px; }
    .team-score { font-size: 2.2rem; font-weight: 900; color: #ffdf00; text-shadow: 2px 2px 0 rgba(0,0,0,0.4); }

    /* FULL-WIDTH BOTTOM KEYBOARD */
    .keyboard-bar {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .kb-row {
      display: flex;
      width: 100%;
      gap: 4px;
    }
    .key-btn {
      flex: 1;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      touch-action: manipulation;
    }
    .key-btn:active:not(:disabled) { background: #ffdf00; color: #000; }
    .key-btn:disabled { opacity: 0.25; cursor: not-allowed; background: rgba(0,0,0,0.4); border-color: transparent; }

    /* MODALS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .setup-card { background: rgba(30, 27, 75, 0.95); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 30px; width: 100%; max-width: 500px; text-align: center; }
    .setup-title { font-size: 2.2rem; font-weight: 900; color: #ffdf00; margin-bottom: 6px; }
    .input-label { font-size: 0.85rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 12px 0 6px; text-align: left; }
    .phrase-input { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3); background: #0f172a; color: #fff; outline: none; }
    .start-btn { width: 100%; background: #ffdf00; color: #000; border: none; padding: 14px; font-size: 1.2rem; font-weight: 900; border-radius: 12px; margin-top: 18px; cursor: pointer; box-shadow: 0 4px 0 #b49d00; }
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .dashboard-panel { height: auto; flex-direction: column; padding: 10px; gap: 10px; }
      .left-controls, .right-scoreboard { width: 100%; }
      .right-scoreboard { flex-direction: row; height: 70px; }
      .key-btn { height: 42px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">🎡 Wheel of Fortune</div>
    <button class="setup-btn" onclick="openSetupModal()">🔒 Teacher Setup</button>
  </header>

  <!-- CATEGORY BADGE -->
  <div class="category-container">
    <div class="category-badge" id="categoryBadge">⚡ CATEGORY: PHRASE</div>
  </div>

  <!-- MULTI-ROW PUZZLE BOARD -->
  <main class="board-container" id="boardContainer"></main>

  <!-- DASHBOARD CONTROLS -->
  <section class="dashboard-panel">
    <!-- LEFT CONTROLS -->
    <div class="left-controls">
      <div class="status-text" id="statusText">Click the wheel to spin!</div>
      <div class="turn-badge" id="turnBadge">🔴 Team 1's Turn</div>
      <button class="ctrl-btn btn-vowel" onclick="buyVowel()">💳 Buy Vowel (100 pts)</button>
      <button class="ctrl-btn btn-solve" onclick="promptSolve()">✅ SOLVE!</button>
    </div>

    <!-- CENTER WHEEL -->
    <div class="wheel-wrapper" onclick="spinWheel()">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="200" height="200"></canvas>
    </div>

    <!-- RIGHT SCOREBOARD -->
    <div class="right-scoreboard">
      <div class="team-box team-1 active" id="team1Box">
        <div class="team-name">● TEAM 1</div>
        <div class="team-score" id="score1">0</div>
      </div>
      <div class="team-box team-2" id="team2Box">
        <div class="team-name">● TEAM 2</div>
        <div class="team-score" id="score2">0</div>
      </div>
    </div>
  </section>

  <!-- FULL-WIDTH BOTTOM KEYBOARD (TABLET & TOUCH FRIENDLY) -->
  <footer class="keyboard-bar" id="keyboardBar"></footer>

  <!-- TEACHER SETUP MODAL -->
  <div id="setupModal" class="modal-overlay">
    <div class="setup-card">
      <div class="setup-title">🎡 Wheel Setup</div>
      
      <div class="input-label">Category Tag</div>
      <select id="categorySelect" class="phrase-input" onchange="handleCategoryChange(this.value)">
        <option value="PHRASE">PHRASE</option>
        <option value="THING">THING</option>
        <option value="PERSON / CHARACTER">PERSON / CHARACTER</option>
        <option value="PLACE">PLACE</option>
        <option value="MOVIE / TV SHOW">MOVIE / TV SHOW</option>
        <option value="FOOD & DRINK">FOOD & DRINK</option>
        <option value="CUSTOM">CUSTOM CATEGORY...</option>
      </select>
      <input type="text" id="customCategoryInput" class="phrase-input hidden" placeholder="Type custom category..." style="margin-top: 8px;">

      <div class="input-label">Secret Phrase</div>
      <input type="password" id="phraseInput" class="phrase-input" placeholder="Type secret phrase..." autocomplete="off">

      <button class="start-btn" onclick="startGameFromSetup()">▶ START GAME</button>
    </div>
  </div>

  <script>
    let secretPhrase = "CLASSROOM ARCADE";
    let categoryTag = "PHRASE";
    let revealedLetters = new Set();
    let currentTeam = 1;
    let scores = { 1: 0, 2: 0 };
    let spunValue = 0;
    let isSpinning = false;
    let canGuessConsonant = false;
    let buyingVowel = false;

    const slices = [
      { label: '100', color: '#ec4899', value: 100 },
      { label: '200', color: '#f97316', value: 200 },
      { label: '300', color: '#22c55e', value: 300 },
      { label: '400', color: '#3b82f6', value: 400 },
      { label: '500', color: '#eab308', value: 500, textColor: '#000' },
      { label: 'LOSE', color: '#1e1b4b', value: 'LOSE' },
      { label: '200', color: '#f97316', value: 200 },
      { label: '100', color: '#ec4899', value: 100 },
      { label: '300', color: '#22c55e', value: 300 },
      { label: '400', color: '#3b82f6', value: 400 },
      { label: '500', color: '#eab308', value: 500, textColor: '#000' },
      { label: 'LOSE', color: '#1e1b4b', value: 'LOSE' }
    ];

    let currentAngle = 0;

    window.onload = function() {
      drawWheel();
      buildKeyboard();

      const urlParams = new URLSearchParams(window.location.search);
      const encodedPhrase = urlParams.get('p');
      const encodedCat = urlParams.get('c');

      if (encodedPhrase) {
        try {
          secretPhrase = atob(encodedPhrase).toUpperCase();
          categoryTag = encodedCat ? atob(encodedCat).toUpperCase() : "PHRASE";
          document.getElementById('setupModal').classList.add('hidden');
          initGame();
          return;
        } catch (e) {}
      }
      openSetupModal();
    };

    function openSetupModal() {
      document.getElementById('setupModal').classList.remove('hidden');
    }

    function handleCategoryChange(val) {
      document.getElementById('customCategoryInput').classList.toggle('hidden', val !== 'CUSTOM');
    }

    function startGameFromSetup() {
      const input = document.getElementById('phraseInput').value.trim().toUpperCase();
      if (!input || !/^[A-Z\s]+$/.test(input)) {
        alert("Please enter a phrase using letters and spaces only!");
        return;
      }
      secretPhrase = input;
      const catSelect = document.getElementById('categorySelect').value;
      categoryTag = catSelect === 'CUSTOM' ? (document.getElementById('customCategoryInput').value.trim().toUpperCase() || "PUZZLE") : catSelect;
      
      document.getElementById('setupModal').classList.add('hidden');
      initGame();
    }

    function initGame() {
      revealedLetters.clear();
      scores = { 1: 0, 2: 0 };
      currentTeam = 1;
      canGuessConsonant = false;
      buyingVowel = false;

      document.getElementById('categoryBadge').textContent = `⚡ CATEGORY: ${categoryTag}`;
      updateScoreboard();
      renderBoard();
      resetKeyboard();
      document.getElementById('statusText').textContent = "Click the wheel to spin!";
    }

    /* MULTI-ROW WORD WRAPPING LOGIC */
    function renderBoard() {
      const container = document.getElementById('boardContainer');
      container.innerHTML = "";

      const words = secretPhrase.split(' ');
      const rows = [];
      let currentRow = [];
      let currentLen = 0;
      const maxRowLen = 12;

      words.forEach(word => {
        if (currentLen + word.length + (currentRow.length ? 1 : 0) <= maxRowLen) {
          currentRow.push(word);
          currentLen += word.length + (currentRow.length > 1 ? 1 : 0);
        } else {
          if (currentRow.length) rows.push(currentRow.join(' '));
          currentRow = [word];
          currentLen = word.length;
        }
      });
      if (currentRow.length) rows.push(currentRow.join(' '));

      rows.forEach(rowText => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'puzzle-row';

        for (let char of rowText) {
          const card = document.createElement('div');
          if (char === ' ') {
            card.className = 'tile-card space';
          } else if (revealedLetters.has(char)) {
            card.className = 'tile-card letter-revealed';
            card.textContent = char;
          } else {
            card.className = 'tile-card letter-hidden';
          }
          rowDiv.appendChild(card);
        }
        container.appendChild(rowDiv);
      });
    }

    /* WHEEL CANVAS */
    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const numSlices = slices.length;
      const arc = (2 * Math.PI) / numSlices;

      ctx.clearRect(0, 0, 200, 200);

      for (let i = 0; i < numSlices; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = slices[i].color;
        ctx.moveTo(100, 100);
        ctx.arc(100, 100, 95, angle, angle + arc);
        ctx.lineTo(100, 100);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,0.3)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.translate(100, 100);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = slices[i].textColor || "#ffffff";
        ctx.font = "bold 13px 'Segoe UI', sans-serif";
        ctx.fillText(slices[i].label, 85, 4);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(100, 100, 16, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }

    function spinWheel() {
      if (isSpinning || canGuessConsonant || buyingVowel) return;
      isSpinning = true;
      document.getElementById('statusText').textContent = "Spinning...";

      const extraRotations = 5 + Math.random() * 5;
      const targetAngle = currentAngle + extraRotations * 2 * Math.PI;
      const startTime = performance.now();
      const duration = 3500;

      function animate(now) {
        const elapsed = now - startTime;
        if (elapsed < duration) {
          const easeOut = 1 - Math.pow(1 - elapsed / duration, 3);
          currentAngle = targetAngle * easeOut;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = targetAngle % (2 * Math.PI);
          drawWheel();
          isSpinning = false;
          evaluateWheelStop();
        }
      }
      requestAnimationFrame(animate);
    }

    function evaluateWheelStop() {
      const numSlices = slices.length;
      const arc = (2 * Math.PI) / numSlices;
      let normalized = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
      const landedIndex = Math.floor(normalized / arc) % numSlices;
      const result = slices[landedIndex];

      if (result.value === 'LOSE') {
        document.getElementById('statusText').textContent = "Landed on LOSE TURN!";
        switchTurn();
      } else {
        spunValue = result.value;
        canGuessConsonant = true;
        document.getElementById('statusText').textContent = `Landed on $${spunValue}! Pick a consonant.`;
      }
    }

    /* FULL WIDTH KEYBOARD */
    function buildKeyboard() {
      const kb = document.getElementById('keyboardBar');
      kb.innerHTML = "";
      const row1 = "ABCDEFGHIJKLM";
      const row2 = "NOPQRSTUVWXYZ";

      [row1, row2].forEach(rowStr => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'kb-row';
        for (let char of rowStr) {
          const btn = document.createElement('button');
          btn.className = 'key-btn';
          btn.textContent = char;
          btn.id = `key-${char}`;
          btn.onclick = () => handleLetterGuess(char);
          rowDiv.appendChild(btn);
        }
        kb.appendChild(rowDiv);
      });
    }

    function resetKeyboard() {
      document.querySelectorAll('.key-btn').forEach(btn => btn.disabled = false);
    }

    function handleLetterGuess(char) {
      const isVowel = 'AEIOU'.includes(char);
      const keyBtn = document.getElementById(`key-${char}`);
      if (keyBtn) keyBtn.disabled = true;

      if (buyingVowel) {
        if (!isVowel) {
          alert("Please pick a Vowel (A, E, I, O, U)!");
          return;
        }
        buyingVowel = false;
        processGuess(char, 0);
        return;
      }

      if (!canGuessConsonant) {
        alert("Spin the wheel first!");
        return;
      }

      if (isVowel) {
        alert("That's a vowel! Click 'Buy Vowel' to purchase one.");
        return;
      }

      canGuessConsonant = false;
      processGuess(char, spunValue);
    }

    function processGuess(char, pointsPerOccurrence) {
      revealedLetters.add(char);
      renderBoard();

      const occurrences = (secretPhrase.match(new RegExp(char, "g")) || []).length;

      if (occurrences > 0) {
        const earned = occurrences * pointsPerOccurrence;
        scores[currentTeam] += earned;
        updateScoreboard();
        document.getElementById('statusText').textContent = `Found ${occurrences} '${char}'! +$${earned}`;
        checkWin();
      } else {
        document.getElementById('statusText').textContent = `No '${char}' found!`;
        switchTurn();
      }
    }

    function buyVowel() {
      if (isSpinning || canGuessConsonant || buyingVowel) return;
      if (scores[currentTeam] < 100) {
        alert("You need 100 points to buy a vowel!");
        return;
      }
      scores[currentTeam] -= 100;
      updateScoreboard();
      buyingVowel = true;
      document.getElementById('statusText').textContent = "Pick a vowel (A, E, I, O, U)";
    }

    function switchTurn() {
      canGuessConsonant = false;
      buyingVowel = false;
      currentTeam = currentTeam === 1 ? 2 : 1;
      updateScoreboard();
    }

    function updateScoreboard() {
      document.getElementById('score1').textContent = scores[1];
      document.getElementById('score2').textContent = scores[2];
      
      const badge = document.getElementById('turnBadge');
      badge.textContent = currentTeam === 1 ? "🔴 Team 1's Turn" : "🔵 Team 2's Turn";
      badge.style.background = currentTeam === 1 ? "#ef4444" : "#1d4ed8";

      document.getElementById('team1Box').classList.toggle('active', currentTeam === 1);
      document.getElementById('team2Box').classList.toggle('active', currentTeam === 2);
    }

    function promptSolve() {
      const guess = prompt("Enter your solution guess:")?.toUpperCase().trim();
      if (!guess) return;

      if (guess === secretPhrase) {
        for (let char of secretPhrase) if (char !== ' ') revealedLetters.add(char);
        renderBoard();
        document.getElementById('statusText').textContent = `🎉 TEAM ${currentTeam} SOLVED IT!`;
        setTimeout(() => alert(`🎉 Team ${currentTeam} wins with $${scores[currentTeam]}!`), 300);
      } else {
        alert("Incorrect guess!");
        switchTurn();
      }
    }

    function checkWin() {
      const allRevealed = secretPhrase.split('').every(c => c === ' ' || revealedLetters.has(c));
      if (allRevealed) {
        document.getElementById('statusText').textContent = `🎉 TEAM ${currentTeam} SOLVED IT!`;
        setTimeout(() => alert(`🎉 Team ${currentTeam} wins with $${scores[currentTeam]}!`), 300);
      }
    }

    /* HARDWARE KEYBOARD LISTENER (IPAD MAGIC KEYBOARD / PC) */
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('setupModal').classList.contains('hidden')) return;
      const key = e.key.toUpperCase();
      if (/^[A-Z]$/.test(key)) {
        const btn = document.getElementById(`key-${key}`);
        if (btn && !btn.disabled) handleLetterGuess(key);
      }
    });
  </script>
</body>
</html>
